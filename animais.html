<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>🐾 Animais Kids</title>

<style>

/* =====================================================
   CONFIGURAÇÃO GERAL
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: linear-gradient(135deg, #74b816, #40c057, #20c997);
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
}


/* =====================================================
   APLICAÇÃO (TELA CHEIA)
===================================================== */

.app {
    width: 100%;
    height: 100%;
    max-width: 1200px;
    max-height: 100%;
    background: rgba(255,255,255,.98);
    border-radius: 20px;
    padding: 10px 14px;
    box-shadow: 0 8px 25px rgba(0,0,0,.25);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}


/* =====================================================
   BOTÃO VOLTAR (BLOQUEIO PARENTAL)
===================================================== */

.voltar-container {
    width: 100%;
    max-width: 150px;
    background: #e9ecef;
    padding: 4px 8px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    align-self: flex-start;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.08);
    flex-shrink: 0;
}

.voltar-container label {
    font-size: 10px;
    color: #495057;
    font-weight: bold;
    text-align: center;
    display: flex;
    align-items: center;
    gap: 3px;
}

.slider-voltar {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 16px;
    border-radius: 8px;
    background: #dee2e6;
    outline: none;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.15);
    cursor: pointer;
}

.slider-voltar::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #20c997;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,.25);
}

.slider-voltar::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #20c997;
    cursor: pointer;
    border: none;
    box-shadow: 0 2px 5px rgba(0,0,0,.25);
}


/* =====================================================
   CABEÇALHO
===================================================== */

header {
    text-align: center;
    flex-shrink: 0;
    margin-bottom: 4px;
}

.personagem {
    font-size: clamp(24px, 4.5vh, 45px);
    line-height: 1;
    animation: pular 1.5s infinite;
}

@keyframes pular {
    50% { transform: translateY(-4px); }
}

h1 {
    font-size: clamp(20px, 4vh, 35px);
    color: #2b8a3e;
    line-height: 1.1;
}

.subtitulo {
    margin-top: 2px;
    color: #666;
    font-size: clamp(11px, 2vh, 15px);
}


/* =====================================================
   MENSAGEM
===================================================== */

.mensagem {
    width: 100%;
    min-height: 38px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff3bf;
    border-radius: 12px;
    font-size: clamp(14px, 3vh, 22px);
    font-weight: bold;
    text-align: center;
    padding: 4px;
    margin: 4px 0;
    flex-shrink: 0;
}


/* =====================================================
   GRADE DOS ANIMAIS (GRID RESPONSIVO)
===================================================== */

.animais {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: clamp(6px, 1.2vh, 12px);
    width: 100%;
    flex: 1;
    min-height: 0;
}


/* =====================================================
   BOTÃO DO ANIMAL
===================================================== */

.animal {
    border: none;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    border-radius: clamp(12px, 2vw, 20px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    position: relative;
    transition: transform .1s, box-shadow .1s;
    box-shadow: 0 4px 0 rgba(0,0,0,.15);
    touch-action: manipulation;
    overflow: hidden;
}

.animal:active,
.animal.animando {
    transform: translateY(3px) scale(.96);
    box-shadow: none;
}


/* =====================================================
   EMOJI
===================================================== */

.emoji {
    font-size: clamp(30px, 7vh, 60px);
    line-height: 1;
    transition: transform .15s;
}

.animal:active .emoji {
    transform: scale(1.1);
}


/* =====================================================
   NOME
===================================================== */

.nome {
    margin-top: 2px;
    font-size: clamp(10px, 2vh, 16px);
    font-weight: bold;
    color: #333;
    line-height: 1;
}


/* =====================================================
   SOM ESCRITO
===================================================== */

.som {
    margin-top: 2px;
    font-size: clamp(8px, 1.5vh, 13px);
    color: #555;
    line-height: 1;
}


/* =====================================================
   ÍCONE DE SOM
===================================================== */

.icone-som {
    position: absolute;
    top: 3px;
    right: 4px;
    font-size: clamp(10px, 1.8vh, 16px);
}


/* =====================================================
   CORES DOS ANIMAIS
===================================================== */

.cachorro { background: #ffd8a8; }
.gato { background: #ffdeeb; }
.vaca { background: #f8f9fa; }
.porco { background: #fcc2d7; }
.leao { background: #ffe066; }
.macaco { background: #d8f5a2; }
.galinha { background: #fff3bf; }
.pato { background: #a5d8ff; }
.elefante { background: #ced4da; }
.cavalo { background: #e7c9a9; }
.ovelha { background: #f1f3f5; }
.sapo { background: #b2f2bb; }


/* =====================================================
   AVISO
===================================================== */

.aviso {
    display: none;
    margin-top: 4px;
    padding: 6px;
    border-radius: 8px;
    background: #ffe3e3;
    color: #c92a2a;
    text-align: center;
    font-size: 11px;
    flex-shrink: 0;
}


/* =====================================================
   BOTÃO PARAR
===================================================== */

.controles {
    display: flex;
    justify-content: center;
    margin-top: 4px;
    flex-shrink: 0;
}

.btn-parar {
    border: none;
    border-radius: 10px;
    min-height: 36px;
    padding: 5px 25px;
    color: white;
    background: #fa5252;
    font-size: clamp(11px, 2vh, 15px);
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
}

.btn-parar:active {
    transform: scale(.96);
}


/* =====================================================
   INSTRUÇÃO
===================================================== */

.instrucao {
    margin-top: 4px;
    padding: 4px;
    background: #f1f3f5;
    border-radius: 8px;
    color: #555;
    text-align: center;
    font-size: clamp(8px, 1.5vh, 12px);
    line-height: 1.1;
    flex-shrink: 0;
}


/* =====================================================
   MODO PAISAGEM / CELULAR DEITADO
===================================================== */

@media(orientation: landscape) {
    .personagem {
        display: none;
    }

    h1 {
        font-size: clamp(16px, 3.5vh, 26px);
    }

    .subtitulo {
        display: none;
    }

    .mensagem {
        min-height: 28px;
        margin: 2px 0;
        font-size: clamp(12px, 2.5vh, 18px);
    }

    .animais {
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: clamp(5px, 1vh, 10px);
    }

    .som {
        display: none; /* Oculta o som escrito em paisagem para caber perfeitamente */
    }

    .instrucao {
        display: none;
    }
}


/* =====================================================
   TELAS MUITO PEQUENAS OU BAIXAS
===================================================== */

@media(max-height: 450px) {
    .personagem, .subtitulo, .instrucao {
        display: none;
    }

    h1 {
        font-size: 16px;
    }

    .mensagem {
        min-height: 25px;
        font-size: 12px;
    }

    .som {
        display: none;
    }
}

</style>

</head>


<body>

<div class="app">

    <div class="voltar-container">
        <label for="sliderVoltar">🔒 Arraste ➡️ Sair</label>
        <input type="range" id="sliderVoltar" class="slider-voltar" min="0" max="100" value="0">
    </div>

    <header>
        <div class="personagem">🧒🐾</div>
        <h1>🐾 Animais Kids</h1>
        <div class="subtitulo">Toque nos animais e descubra seus sons!</div>
    </header>

    <div class="mensagem" id="mensagem">
        👆 Toque em um animal!
    </div>

    <div class="animais">

        <button class="animal cachorro" data-animal="Cachorro" data-audio="cachorro.mp3" onclick="tocarAnimal(this)">
            <span class="icone-som">🔊</span>
            <div class="emoji">🐶</div>
            <div class="nome">Cachorro</div>
            <div class="som">Au au!</div>
        </button>

        <button class="animal gato" data-animal="Gato" data-audio="gato.mp3" onclick="tocarAnimal(this)">
            <span class="icone-som">🔊</span>
            <div class="emoji">🐱</div>
            <div class="nome">Gato</div>
            <div class="som">Miau!</div>
        </button>

        <button class="animal vaca" data-animal="Vaca" data-audio="vaca.mp3" onclick="tocarAnimal(this)">
            <span class="icone-som">🔊</span>
            <div class="emoji">🐮</div>
            <div class="nome">Vaca</div>
            <div class="som">Muuu!</div>
        </button>

        <button class="animal porco" data-animal="Porco" data-audio="porco.mp3" onclick="tocarAnimal(this)">
            <span class="icone-som">🔊</span>
            <div class="emoji">🐷</div>
            <div class="nome">Porco</div>
            <div class="som">Oinc!</div>
        </button>

        <button class="animal leao" data-animal="Leão" data-audio="leao.mp3" onclick="tocarAnimal(this)">
            <span class="icone-som">🔊</span>
            <div class="emoji">🦁</div>
            <div class="nome">Leão</div>
            <div class="som">Grrrr!</div>
        </button>

        <button class="animal macaco" data-animal="Macaco" data-audio="macaco.mp3" onclick="tocarAnimal(this)">
            <span class="icone-som">🔊</span>
            <div class="emoji">🐵</div>
            <div class="nome">Macaco</div>
            <div class="som">Uh uh!</div>
        </button>

        <button class="animal galinha" data-animal="Galinha" data-audio="galinha.mp3" onclick="tocarAnimal(this)">
            <span class="icone-som">🔊</span>
            <div class="emoji">🐔</div>
            <div class="nome">Galinha</div>
            <div class="som">Cocoricó!</div>
        </button>

        <button class="animal pato" data-animal="Pato" data-audio="pato.mp3" onclick="tocarAnimal(this)">
            <span class="icone-som">🔊</span>
            <div class="emoji">🦆</div>
            <div class="nome">Pato</div>
            <div class="som">Quá quá!</div>
        </button>

        <button class="animal elefante" data-animal="Elefante" data-audio="elefante.mp3" onclick="tocarAnimal(this)">
            <span class="icone-som">🔊</span>
            <div class="emoji">🐘</div>
            <div class="nome">Elefante</div>
            <div class="som">Pruuu!</div>
        </button>

        <button class="animal cavalo" data-animal="Cavalo" data-audio="cavalo.mp3" onclick="tocarAnimal(this)">
            <span class="icone-som">🔊</span>
            <div class="emoji">🐴</div>
            <div class="nome">Cavalo</div>
            <div class="som">Hiiiin!</div>
        </button>

        <button class="animal ovelha" data-animal="Ovelha" data-audio="ovelha.mp3" onclick="tocarAnimal(this)">
            <span class="icone-som">🔊</span>
            <div class="emoji">🐑</div>
            <div class="nome">Ovelha</div>
            <div class="som">Bééé!</div>
        </button>

        <button class="animal sapo" data-animal="Sapo" data-audio="sapo.mp3" onclick="tocarAnimal(this)">
            <span class="icone-som">🔊</span>
            <div class="emoji">🐸</div>
            <div class="nome">Sapo</div>
            <div class="som">Coax!</div>
        </button>

    </div>

    <div class="aviso" id="aviso">
        ⚠️ Arquivo de áudio não encontrado.
    </div>

    <div class="controles">
        <button class="btn-parar" onclick="pararSom()">
            🛑 Parar som
        </button>
    </div>

    <div class="instrucao">
        📱 Toque em um animal para ouvir seu som!
    </div>

</div>

<script>

const pastaSons = "sons/";
let somAtual = null;

function tocarAnimal(animal) {
    pararSom();
    const arquivo = animal.dataset.audio;
    const caminho = pastaSons + arquivo;

    somAtual = new Audio(caminho);
    somAtual.volume = 1;

    somAtual.play().catch(() => {
        mostrarAvisoAudio();
    });

    animal.classList.add("animando");
    setTimeout(() => {
        animal.classList.remove("animando");
    }, 300);

    document.getElementById("mensagem").innerHTML =
        animal.querySelector(".emoji").textContent + " " + animal.dataset.animal;
}

function pararSom() {
    if (somAtual) {
        somAtual.pause();
        somAtual.currentTime = 0;
        somAtual = null;
    }
}

function mostrarAvisoAudio() {
    const aviso = document.getElementById("aviso");
    aviso.style.display = "block";
    setTimeout(() => {
        aviso.style.display = "none";
    }, 3500);
}

const sliderVoltar = document.getElementById("sliderVoltar");

function resetarSlider() {
    if (sliderVoltar.value < 100) {
        sliderVoltar.value = 0;
    }
}

sliderVoltar.addEventListener("input", function() {
    if (parseInt(this.value, 10) === 100) {
        window.location.href = "index.html";
    }
});

sliderVoltar.addEventListener("change", resetarSlider);
sliderVoltar.addEventListener("touchend", resetarSlider);
sliderVoltar.addEventListener("mouseup", resetarSlider);

</script>

</body>

</html>
