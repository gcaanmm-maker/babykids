<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎨 Pintura e Colorir Kids</title>

<style>
/* =====================================================
   CONFIGURAÇÃO GERAL
===================================================== */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fecfef, #a1c4fd);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
}

/* =====================================================
   APLICAÇÃO
===================================================== */
.app {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1200px;
    background: #f8f9fa;
    border-radius: 20px;
    padding: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* =====================================================
   CABEÇALHO & NAVEGAÇÃO
===================================================== */
header {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 15px;
    margin-bottom: 8px;
    flex-shrink: 0;
}

/* Botão de Voltar (Slider) */
.slider-voltar-container {
    width: 130px;
    height: 36px;
    background: rgba(0, 0, 0, 0.08);
    border: 2px solid rgba(0, 0, 0, 0.15);
    border-radius: 20px;
    padding: 2px;
    display: flex;
    align-items: center;
    touch-action: none;
    position: relative;
    flex-shrink: 0;
}
.slider-voltar-texto {
    position: absolute;
    width: 100%;
    text-align: center;
    font-size: 10px;
    font-weight: bold;
    color: #444;
    pointer-events: none;
    padding-left: 22px;
}
.slider-voltar-botao {
    width: 28px;
    height: 28px;
    background: #ff6b6b;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    cursor: grab;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    position: relative;
    z-index: 2;
    touch-action: none;
}
.slider-voltar-botao:active { cursor: grabbing; }

/* Botões de Troca de Tela (1 e 2) */
.seletor-modo {
    display: flex;
    gap: 6px;
    background: #e9ecef;
    padding: 4px;
    border-radius: 15px;
}
.btn-modo {
    border: none;
    background: transparent;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: clamp(11px, 2vw, 15px);
    font-weight: bold;
    color: #555;
    cursor: pointer;
    transition: 0.2s;
}
.btn-modo.ativo {
    background: #4dabf7;
    color: white;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}

h1 {
    font-size: clamp(16px, 3vw, 24px);
    color: #ff6b6b;
    margin-left: auto;
    padding-right: 10px;
}

/* =====================================================
   ÁREA PRINCIPAL (CANVAS + MENU LATERAL)
===================================================== */
.conteudo-principal {
    display: flex;
    flex: 1;
    gap: 8px;
    min-height: 0;
    margin-bottom: 8px;
}

.area-canvas {
    flex: 1;
    border-radius: 15px;
    border: 3px solid #dee2e6;
    background: #ffffff;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
}
canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
}

/* Painel Direito (Desenhos Prontos) */
.painel-colorir {
    display: none; /* Oculto na tela 1 */
    width: 80px;
    flex-direction: column;
    gap: 8px;
    background: #e9ecef;
    border-radius: 15px;
    padding: 8px;
    overflow-y: auto;
    align-items: center;
}
.painel-colorir h3 {
    font-size: 10px;
    text-align: center;
    color: #555;
    margin-bottom: 4px;
}
.btn-forma {
    width: 50px;
    height: 50px;
    background: white;
    border: 2px solid #ced4da;
    border-radius: 10px;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.1);
}
.btn-forma:active {
    transform: translateY(3px);
    box-shadow: none;
}

/* =====================================================
   BARRAS DE FERRAMENTAS INFERIOR
===================================================== */
.ferramentas {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
}
.linha-ferramentas {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.btn-ferramenta, .btn-cor, .btn-carimbo {
    border: 2px solid transparent;
    border-radius: 12px;
    background: white;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.1s;
    touch-action: manipulation;
}
.btn-ferramenta:active, .btn-cor:active, .btn-carimbo:active {
    transform: translateY(4px);
    box-shadow: none;
}

.btn-ferramenta {
    padding: 6px 12px;
    font-size: clamp(11px, 2vw, 15px);
    font-weight: bold;
    color: #444;
}
.btn-ferramenta.ativo {
    background: #ffe3e3;
    border-color: #ff6b6b;
}

.btn-cor {
    width: clamp(28px, 5vw, 40px);
    height: clamp(28px, 5vw, 40px);
    border-radius: 50%;
}
.btn-cor.ativo {
    border: 3px solid #333;
    transform: scale(1.1);
}

.btn-carimbo {
    width: clamp(35px, 6vw, 45px);
    height: clamp(35px, 6vw, 45px);
    font-size: clamp(20px, 4vw, 26px);
    background: #e7f5ff;
}
.btn-carimbo.ativo {
    background: #d0ebff;
    border-color: #339af0;
    transform: scale(1.1);
}

.btn-limpar { background: #fa5252; color: white; }
.btn-salvar { background: #40c057; color: white; }

/* =====================================================
   RESPONSIVIDADE 
===================================================== */
@media(max-width: 700px) {
    header { flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 5px; }
    h1 { display: none; } /* Esconde título em telas pequenas para dar espaço aos botões */
    .slider-voltar-container { width: 110px; }
    .painel-colorir { width: 65px; padding: 5px; }
    .btn-forma { width: 45px; height: 45px; font-size: 22px; }
    .btn-ferramenta { padding: 5px 8px; }
}
@media(max-height: 500px) and (orientation: landscape) {
    header { margin-bottom: 3px; }
    .conteudo-principal { margin-bottom: 4px; }
    .ferramentas { flex-direction: row; gap: 15px; }
    .linha-ferramentas { gap: 5px; }
    #paletaCarimbos { display: none; } /* Oculta carimbos em landscape para caber na tela */
}
</style>
</head>
<body>

<div class="app">

    <!-- CABEÇALHO (VOLTAR E TROCA DE MODO) -->
    <header>
        <div class="slider-voltar-container" id="sliderPista">
            <span class="slider-voltar-texto"> Deslize p/ Sair</span>
            <div class="slider-voltar-botao" id="sliderBotao"></div>
        </div>

        <div class="seletor-modo">
            <button class="btn-modo ativo" id="btnModo1" onclick="alterarModoTela(1)">1️⃣ Livre</button>
            <button class="btn-modo" id="btnModo2" onclick="alterarModoTela(2)">2️⃣ Colorir</button>
        </div>

        <h1>🎨 Pintura Kids</h1>
    </header>

    <!-- ÁREA CENTRAL -->
    <div class="conteudo-principal">
        <div class="area-canvas" id="areaCanvas">
            <canvas id="telaDesenho"></canvas>
        </div>
        
        <!-- PAINEL DE FORMAS (Só aparece na Tela 2) -->
        <div class="painel-colorir" id="painelColorir">
            <h3>Desenhos</h3>
            <button class="btn-forma" onclick="desenharForma('circulo')">⚪</button>
            <button class="btn-forma" onclick="desenharForma('quadrado')">🔲</button>
            <button class="btn-forma" onclick="desenharForma('estrela')">⭐</button>
            <button class="btn-forma" onclick="desenharForma('coracao')">❤️</button>
            <button class="btn-forma" onclick="desenharForma('nuvem')">☁️</button>
        </div>
    </div>

    <!-- FERRAMENTAS -->
    <div class="ferramentas">
        <!-- Cores -->
        <div class="linha-ferramentas" id="paletaCores">
            <button class="btn-cor ativo" style="background: #212529;" data-cor="#212529"></button>
            <button class="btn-cor" style="background: #fa5252;" data-cor="#fa5252"></button>
            <button class="btn-cor" style="background: #fd7e14;" data-cor="#fd7e14"></button>
            <button class="btn-cor" style="background: #fcc419;" data-cor="#fcc419"></button>
            <button class="btn-cor" style="background: #40c057;" data-cor="#40c057"></button>
            <button class="btn-cor" style="background: #228be6;" data-cor="#228be6"></button>
            <button class="btn-cor" style="background: #be4bdb;" data-cor="#be4bdb"></button>
            <button class="btn-cor" style="background: #f783ac;" data-cor="#f783ac"></button>
            <button class="btn-cor" style="background: #ffffff; border: 1px solid #ccc" data-cor="#ffffff"></button>
        </div>

        <!-- Acessórios -->
        <div class="linha-ferramentas">
            <button class="btn-ferramenta ativo" id="btnPincel" onclick="setFerramenta('pincel')">🖌️ Pincel</button>
            <button class="btn-ferramenta" id="btnBorracha" onclick="setFerramenta('borracha')">🧽 Borracha</button>
            <button class="btn-ferramenta" id="btnBalde" onclick="setFerramenta('balde')">🪣 Balde</button>
            <button class="btn-ferramenta" onclick="mudarTamanho(5)">〰️ Fino</button>
            <button class="btn-ferramenta" onclick="mudarTamanho(25)">🛹 Grosso</button>
        </div>

        <!-- Carimbos e Ações -->
        <div class="linha-ferramentas" id="paletaCarimbos">
            <button class="btn-carimbo" data-carimbo="⭐">⭐</button>
            <button class="btn-carimbo" data-carimbo="💖">💖</button>
            <button class="btn-carimbo" data-carimbo="🚀">🚀</button>
            <button class="btn-carimbo" data-carimbo="🦋">🦋</button>
			<button class="btn-carimbo" data-carimbo="🤖">🤖</button>
            <button class="btn-ferramenta btn-limpar" onclick="limparTela()">🗑️ Limpar</button>
            <button class="btn-ferramenta btn-salvar" onclick="salvarDesenho()">💾 Salvar</button>
        </div>
    </div>

</div>

<script>
const canvas = document.getElementById('telaDesenho');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const areaCanvas = document.getElementById('areaCanvas');

let desenhando = false;
let ferramenta = 'pincel'; // pincel, borracha, balde, carimbo
let corAtual = '#212529';
let tamanhoAtual = 15;
let carimboAtual = '⭐';
let telaAtiva = 1; // 1: Livre, 2: Colorir

/* =====================================================
   GERENCIAMENTO DAS DUAS TELAS (1 e 2)
===================================================== */
function alterarModoTela(modo) {
    telaAtiva = modo;
    
    // Atualiza Botões
    document.getElementById('btnModo1').classList.remove('ativo');
    document.getElementById('btnModo2').classList.remove('ativo');
    document.getElementById('btnModo' + modo).classList.add('ativo');

    // Mostra/Oculta Painel Direito
    const painel = document.getElementById('painelColorir');
    if (modo === 2) {
        painel.style.display = 'flex';
        setFerramenta('balde'); // Seleciona o balde de tinta automaticamente
        desenharForma('circulo'); // Desenho padrão ao abrir
    } else {
        painel.style.display = 'none';
        setFerramenta('pincel');
        limparTela();
    }
    
    // Força reajuste do tamanho do canvas
    setTimeout(redimensionarCanvas, 50);
}

/* =====================================================
   CONFIGURAÇÃO DO CANVAS
===================================================== */
function redimensionarCanvas() {
    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    if(canvas.width > 0) tempCtx.drawImage(canvas, 0, 0);

    canvas.width = areaCanvas.clientWidth;
    canvas.height = areaCanvas.clientHeight;
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    if(canvas.width > 0) ctx.drawImage(tempCanvas, 0, 0);
    
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
}

window.addEventListener('resize', redimensionarCanvas);
setTimeout(redimensionarCanvas, 100);

/* =====================================================
   DESENHOS PRONTOS (FORMAS) PARA COLORIR
===================================================== */
function desenharForma(tipo) {
    limparTela();
    ctx.lineWidth = 10;
    ctx.strokeStyle = '#000000'; // Contorno preto grosso
    ctx.fillStyle = '#ffffff';
    
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const size = Math.min(cx, cy) * 0.65;

    ctx.beginPath();
    if (tipo === 'circulo') {
        ctx.arc(cx, cy, size, 0, Math.PI * 2);
    } 
    else if (tipo === 'quadrado') {
        ctx.rect(cx - size, cy - size, size * 2, size * 2);
    } 
    else if (tipo === 'estrela') {
        for (let i = 0; i < 5; i++) {
            ctx.lineTo(cx + Math.cos((18+i*72)/180*Math.PI)*size, cy - Math.sin((18+i*72)/180*Math.PI)*size);
            ctx.lineTo(cx + Math.cos((54+i*72)/180*Math.PI)*(size/2.2), cy - Math.sin((54+i*72)/180*Math.PI)*(size/2.2));
        }
        ctx.closePath();
    } 
    else if (tipo === 'coracao') {
        const topY = cy - size * 0.4;
        ctx.moveTo(cx, topY + size * 0.3);
        ctx.bezierCurveTo(cx, topY - size * 0.3, cx - size * 1.2, topY - size * 0.3, cx - size * 1.2, topY + size * 0.4);
        ctx.bezierCurveTo(cx - size * 1.2, topY + size * 1.2, cx - size * 0.3, topY + size * 1.5, cx, topY + size * 2);
        ctx.bezierCurveTo(cx + size * 0.3, topY + size * 1.5, cx + size * 1.2, topY + size * 1.2, cx + size * 1.2, topY + size * 0.4);
        ctx.bezierCurveTo(cx + size * 1.2, topY - size * 0.3, cx, topY - size * 0.3, cx, topY + size * 0.3);
    }
    else if (tipo === 'nuvem') {
        ctx.arc(cx - size*0.5, cy, size*0.5, Math.PI*0.5, Math.PI*1.5);
        ctx.arc(cx, cy - size*0.3, size*0.6, Math.PI, Math.PI*2);
        ctx.arc(cx + size*0.6, cy, size*0.5, Math.PI*1.5, Math.PI*0.5);
        ctx.closePath();
    }
    ctx.fill();
    ctx.stroke();
}

/* =====================================================
   ALGORITMO BALDE DE TINTA (FLOOD FILL)
===================================================== */
// Converte cor Hex (#FF0000) para RGB
function hexToRgb(hex) {
    return {
        r: parseInt(hex.slice(1,3), 16),
        g: parseInt(hex.slice(3,5), 16),
        b: parseInt(hex.slice(5,7), 16)
    };
}

// Algoritmo Scanline para preencher área rapidamente sem travar o navegador
function aplicarBalde(startX, startY) {
    startX = Math.floor(startX);
    startY = Math.floor(startY);
    
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;
    const w = canvas.width;
    const h = canvas.height;
    
    const startPos = (startY * w + startX) * 4;
    const targetR = data[startPos];
    const targetG = data[startPos+1];
    const targetB = data[startPos+2];
    
    const fill = hexToRgb(corAtual);
    
    // Se clicar numa cor igual a cor atual, não faz nada
    if (Math.abs(targetR - fill.r) < 10 && Math.abs(targetG - fill.g) < 10 && Math.abs(targetB - fill.b) < 10) return;

    // Função de tolerância (para pintar cantos sombreados da linha preta)
    function matchColor(pos) {
        return Math.abs(data[pos] - targetR) <= 60 && 
               Math.abs(data[pos+1] - targetG) <= 60 && 
               Math.abs(data[pos+2] - targetB) <= 60;
    }

    function colorPixel(pos) {
        data[pos] = fill.r;
        data[pos+1] = fill.g;
        data[pos+2] = fill.b;
        data[pos+3] = 255;
    }

    const stack = [[startX, startY]];

    while(stack.length) {
        const [cx, cy] = stack.pop();
        let pos = (cy * w + cx) * 4;
        
        let leftX = cx;
        while(leftX >= 0 && matchColor(pos)) {
            leftX--;
            pos -= 4;
        }
        leftX++;
        pos += 4;
        
        let reachUp = false;
        let reachDown = false;
        
        while(leftX < w && matchColor(pos)) {
            colorPixel(pos);
            
            if (cy > 0) {
                if (matchColor(pos - w * 4)) {
                    if (!reachUp) { stack.push([leftX, cy - 1]); reachUp = true; }
                } else { reachUp = false; }
            }
            if (cy < h - 1) {
                if (matchColor(pos + w * 4)) {
                    if (!reachDown) { stack.push([leftX, cy + 1]); reachDown = true; }
                } else { reachDown = false; }
            }
            leftX++;
            pos += 4;
        }
    }
    ctx.putImageData(imgData, 0, 0);
}

/* =====================================================
   LÓGICA DE DESENHO E FERRAMENTAS
===================================================== */
function obterPosicao(e) {
    const rect = canvas.getBoundingClientRect();
    const clienteX = e.touches ? e.touches[0].clientX : e.clientX;
    const clienteY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clienteX - rect.left, y: clienteY - rect.top };
}

function iniciarDesenho(e) {
    e.preventDefault();
    const pos = obterPosicao(e);

    if (ferramenta === 'carimbo') {
        aplicarCarimbo(pos.x, pos.y);
        return;
    }

    if (ferramenta === 'balde') {
        aplicarBalde(pos.x, pos.y);
        return;
    }

    desenhando = true;
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    ctx.lineWidth = tamanhoAtual;
    ctx.strokeStyle = ferramenta === 'borracha' ? '#ffffff' : corAtual;
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
}

function desenhar(e) {
    if (!desenhando || ferramenta === 'carimbo' || ferramenta === 'balde') return;
    e.preventDefault();
    const pos = obterPosicao(e);
    
    ctx.lineWidth = tamanhoAtual;
    ctx.strokeStyle = ferramenta === 'borracha' ? '#ffffff' : corAtual;
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
}

function pararDesenho(e) {
    if(e) e.preventDefault();
    desenhando = false;
    ctx.closePath();
}

canvas.addEventListener('mousedown', iniciarDesenho);
canvas.addEventListener('mousemove', desenhar);
canvas.addEventListener('mouseup', pararDesenho);
canvas.addEventListener('mouseout', pararDesenho);

canvas.addEventListener('touchstart', iniciarDesenho, {passive: false});
canvas.addEventListener('touchmove', desenhar, {passive: false});
canvas.addEventListener('touchend', pararDesenho);

function aplicarCarimbo(x, y) {
    ctx.font = `${tamanhoAtual * 3.5}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(carimboAtual, x, y);
    ctx.beginPath();
}

function setFerramenta(novaFerramenta) {
    ferramenta = novaFerramenta;
    document.getElementById('btnPincel').classList.remove('ativo');
    document.getElementById('btnBorracha').classList.remove('ativo');
    document.getElementById('btnBalde').classList.remove('ativo');
    document.querySelectorAll('.btn-carimbo').forEach(b => b.classList.remove('ativo'));
    
    if (ferramenta === 'pincel') document.getElementById('btnPincel').classList.add('ativo');
    if (ferramenta === 'borracha') document.getElementById('btnBorracha').classList.add('ativo');
    if (ferramenta === 'balde') document.getElementById('btnBalde').classList.add('ativo');
}

function mudarTamanho(tamanho) { tamanhoAtual = tamanho; }

document.querySelectorAll('.btn-cor').forEach(botao => {
    botao.addEventListener('click', function() {
        if(ferramenta === 'borracha' || ferramenta === 'carimbo') setFerramenta('pincel');
        corAtual = this.dataset.cor;
        document.querySelectorAll('.btn-cor').forEach(b => b.classList.remove('ativo'));
        this.classList.add('ativo');
    });
});

document.querySelectorAll('.btn-carimbo').forEach(botao => {
    botao.addEventListener('click', function() {
        setFerramenta('carimbo');
        carimboAtual = this.dataset.carimbo;
        document.querySelectorAll('.btn-carimbo').forEach(b => b.classList.remove('ativo'));
        this.classList.add('ativo');
    });
});

function limparTela() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function salvarDesenho() {
    const link = document.createElement('a');
    link.download = 'meu_desenho_kids.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
}

/* =====================================================
   LÓGICA DO SLIDER DE VOLTAR
===================================================== */
function voltarPagina() {
    if (window.history.length > 1) {
        window.history.back();
    } else {
        window.location.href = "index.html";
    }
}
const sliderPista = document.getElementById("sliderPista");
const sliderBotao = document.getElementById("sliderBotao");
let isDragging = false;
let startX = 0, currentX = 0;

if (sliderBotao && sliderPista) {
    sliderBotao.addEventListener("pointerdown", function(e) {
        isDragging = true;
        startX = e.clientX - currentX;
        sliderBotao.setPointerCapture(e.pointerId);
        sliderBotao.style.transition = "none";
    });
    sliderBotao.addEventListener("pointermove", function(e) {
        if (!isDragging) return;
        const maxDrag = sliderPista.clientWidth - sliderBotao.clientWidth - 4;
        let x = e.clientX - startX;
        if (x < 0) x = 0;
        if (x > maxDrag) x = maxDrag;
        currentX = x;
        sliderBotao.style.transform = `translateX(${currentX}px)`;
    });
    function finalizarArrasto() {
        if (!isDragging) return;
        isDragging = false;
        const maxDrag = sliderPista.clientWidth - sliderBotao.clientWidth - 4;
        if (currentX >= maxDrag * 0.75) {
            sliderBotao.style.transform = `translateX(${maxDrag}px)`;
            voltarPagina();
            setTimeout(() => {
                sliderBotao.style.transition = "transform 0.3s ease";
                sliderBotao.style.transform = "translateX(0px)";
                currentX = 0;
            }, 500);
        } else {
            sliderBotao.style.transition = "transform 0.3s ease";
            sliderBotao.style.transform = "translateX(0px)";
            currentX = 0;
        }
    }
    sliderBotao.addEventListener("pointerup", finalizarArrasto);
    sliderBotao.addEventListener("pointercancel", finalizarArrasto);
}
</script>
</body>
</html>
