<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Foguetinho Feliz 🚀</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    touch-action:none;
    font-family:Arial,sans-serif;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:linear-gradient(
        180deg,
        #68d9ff,
        #9d8cff,
        #ffb9f5
    );
}

#score{
    position:absolute;
    top:10px;
    right:10px; /* Posicionado à direita */
    z-index:100;
    background:white;
    border-radius:30px;
    padding:10px 18px;
    font-size:24px;
    font-weight:bold;
}

/* =====================================================
   BOTÃO SLIDER "DESLIZE PARA VOLTAR"
===================================================== */
.slider-voltar-container {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 1000;
    width: 145px;
    height: 36px;
    background: rgba(255, 255, 255, 0.25);
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 20px;
    padding: 2px;
    display: flex;
    align-items: center;
    touch-action: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.slider-voltar-texto {
    position: absolute;
    width: 100%;
    text-align: center;
    font-size: 11px;
    font-weight: bold;
    color: #fff;
    pointer-events: none;
    padding-left: 22px;
}

.slider-voltar-botao {
    width: 28px;
    height: 28px;
    background: #6c5ce7;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    cursor: grab;
    box-shadow: 0 2px 5px rgba(0,0,0,0.25);
    position: relative;
    z-index: 2;
    touch-action: none;
}

.slider-voltar-botao:active {
    cursor: grabbing;
}

@media(max-width: 600px) {
    .slider-voltar-container {
        width: 115px;
        height: 30px;
        top: 5px;
        left: 5px;
    }
    .slider-voltar-texto {
        font-size: 8px;
        padding-left: 16px;
    }
    .slider-voltar-botao {
        width: 22px;
        height: 22px;
        font-size: 10px;
    }
}

#rocket{
    position:absolute;
    font-size:70px;
    transform:translate(-50%,-50%);
    z-index:50;
    pointer-events:none;
}

.coin{
    position:absolute;
    font-size:60px;
    z-index:20;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.25);
    }
}

.cloud{
    position:absolute;
    font-size:60px;
    opacity:.8;
    animation:cloudDown linear infinite;
}

@keyframes cloudDown{
    from{
        transform:translateY(-150px);
    }
    to{
        transform:translateY(calc(100vh + 150px));
    }
}

.star{
    position:absolute;
    color:white;
    font-size:24px;
    z-index:1;
}

.effect{
    position:absolute;
    font-size:40px;
    pointer-events:none;
    animation:explode .9s forwards;
}

@keyframes explode{
    from{
        opacity:1;
        transform:scale(.5);
    }
    to{
        opacity:0;
        transform:scale(2.4);
    }
}

#message{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:54px;
    display:none;
    z-index:999;
}
</style>
</head>
<body>

<div id="game">

<!-- BOTÃO DESLIZE PARA VOLTAR -->
<div class="slider-voltar-container" id="sliderPista">
    <span class="slider-voltar-texto">➡️ Deslize p/ Voltar</span>
    <div class="slider-voltar-botao" id="sliderBotao">
        ⬅️
    </div>
</div>

<div id="score">🪙 0</div>

<div id="message">
👏 Muito Bem! 🌈
</div>

<div id="rocket">🚀</div>

</div>

<script>

const game=document.getElementById("game");
const rocket=document.getElementById("rocket");
const scoreEl=document.getElementById("score");
const message=document.getElementById("message");

let score=0;

let rocketX=window.innerWidth/2;
let rocketY=window.innerHeight*0.8;

rocket.style.left=rocketX+"px";
rocket.style.top=rocketY+"px";

function moveRocket(x,y){
    rocketX=x;
    rocketY=y;
    rocket.style.left=x+"px";
    rocket.style.top=y+"px";
}

game.addEventListener("touchmove",e=>{
    e.preventDefault();
    moveRocket(e.touches[0].clientX,e.touches[0].clientY);
});

game.addEventListener("mousemove",e=>{
    moveRocket(e.clientX,e.clientY);
});

function playCoinSound(){
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [523,659,784].forEach((freq,i)=>{
        const osc=ctx.createOscillator();
        const gain=ctx.createGain();
        osc.frequency.value=freq;
        osc.type="sine";
        osc.connect(gain);
        gain.connect(ctx.destination);
        gain.gain.value=0.1;
        osc.start(ctx.currentTime+(i*0.08));
        osc.stop(ctx.currentTime+(i*0.08)+0.15);
    });
}

function speak(){
    if(!window.speechSynthesis) return;
    const text=new SpeechSynthesisUtterance("Muito bem!");
    text.lang="pt-BR";
    text.rate=0.95;
    speechSynthesis.speak(text);
}

function createExplosion(x,y){
    const emojis=["🌈","⭐","🎉","🎈","💖","🦄","🚀","🎁"];
    for(let i=0;i<12;i++){
        const fx=document.createElement("div");
        fx.className="effect";
        fx.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];
        fx.style.left=(x+Math.random()*120-60)+"px";
        fx.style.top=(y+Math.random()*120-60)+"px";
        game.appendChild(fx);
        setTimeout(()=>{
            fx.remove();
        },900);
    }
}

function createCoin(){
    const coin=document.createElement("div");
    coin.className="coin";
    coin.innerHTML="🪙";
    const x=Math.random()*(window.innerWidth-100)+50;
    const y=Math.random()*(window.innerHeight-250)+100;
    
    coin.style.left=x+"px";
    coin.style.top=y+"px";
    game.appendChild(coin);

    const loop=setInterval(()=>{
        let dx=x-rocketX;
        let dy=y-rocketY;
        let distance=Math.sqrt(dx*dx+dy*dy);

        if(distance<70){
            playCoinSound();
            score++;
            scoreEl.innerHTML="🪙 "+score;
            createExplosion(x,y);
            coin.remove();
            clearInterval(loop);

            if(score%10===0){
                message.style.display="block";
                speak();
                setTimeout(()=>{
                    message.style.display="none";
                },2000);
            }

            setTimeout(createCoin,300);
        }
    },30);
}

function createCloud(){
    const cloud=document.createElement("div");
    cloud.className="cloud";
    cloud.innerHTML="☁️";
    cloud.style.left=Math.random()*100+"vw";
    cloud.style.top="-100px";
    cloud.style.animationDuration=(6+Math.random()*8)+"s";
    game.appendChild(cloud);

    setTimeout(()=>{
        cloud.remove();
    },15000);
}

function createStar(){
    const star=document.createElement("div");
    star.className="star";
    star.innerHTML=Math.random()>0.5 ? "✨" : "⭐";
    star.style.left=Math.random()*window.innerWidth+"px";
    star.style.top="-30px";
    game.appendChild(star);

    let y=-30;
    const timer=setInterval(()=>{
        y+=8;
        star.style.top=y+"px";
        if(y>window.innerHeight){
            clearInterval(timer);
            star.remove();
        }
    },16);
}

for(let i=0;i<5;i++){
    setTimeout(createCloud,i*800);
}
setInterval(createCloud,1200);
setInterval(createStar,200);

createCoin();

/* =====================================================
   LÓGICA DO SLIDER "DESLIZE PARA VOLTAR"
===================================================== */
function voltarPagina() {
    if (window.history.length > 1) {
        window.history.back();
    } else {
        window.location.href = "index.html";
    }
}

const sliderPista = document.getElementById("sliderPista");
const sliderBotao = document.getElementById("sliderBotao");

let isDragging = false;
let startX = 0;
let currentX = 0;

if (sliderBotao && sliderPista) {
    sliderBotao.addEventListener("pointerdown", function(e) {
        isDragging = true;
        startX = e.clientX - currentX;
        sliderBotao.setPointerCapture(e.pointerId);
        sliderBotao.style.transition = "none";
    });

    sliderBotao.addEventListener("pointermove", function(e) {
        if (!isDragging) return;
        const maxDrag = sliderPista.clientWidth - sliderBotao.clientWidth - 4;
        let x = e.clientX - startX;
        if (x < 0) x = 0;
        if (x > maxDrag) x = maxDrag;
        currentX = x;
        sliderBotao.style.transform = `translateX(${currentX}px)`;
    });

    function finalizarArrasto(e) {
        if (!isDragging) return;
        isDragging = false;
        const maxDrag = sliderPista.clientWidth - sliderBotao.clientWidth - 4;

        if (currentX >= maxDrag * 0.75) {
            sliderBotao.style.transform = `translateX(${maxDrag}px)`;
            voltarPagina();
            setTimeout(() => {
                sliderBotao.style.transition = "transform 0.3s ease";
                sliderBotao.style.transform = "translateX(0px)";
                currentX = 0;
            }, 500);
        } else {
            sliderBotao.style.transition = "transform 0.3s ease";
            sliderBotao.style.transform = "translateX(0px)";
            currentX = 0;
        }
    }

    sliderBotao.addEventListener("pointerup", finalizarArrasto);
    sliderBotao.addEventListener("pointercancel", finalizarArrasto);
}
</script>
</body>
</html>
