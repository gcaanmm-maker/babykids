<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>🦸‍♂️ Heróis Kids - Aventura</title>

<style>

/* =====================================================
   CONFIGURAÇÃO GERAL
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: linear-gradient(135deg, #1c7ed6, #339af0, #748ffc);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
}

.app {
    width: 100%;
    max-width: 900px;
    height: 100%;
    max-height: 550px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
}

/* =====================================================
   TELA DE SELEÇÃO DE PERSONAGEM
===================================================== */

#telaSelecao {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(28,126,214,0.95), rgba(52,58,64,0.95));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 20px;
    color: white;
    text-align: center;
}

#telaSelecao h2 {
    font-size: clamp(22px, 5vh, 36px);
    margin-bottom: 15px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}

.personagens-grid {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
}

.card-personagem {
    background: white;
    color: #333;
    padding: 15px 25px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    transition: transform 0.2s, background 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 4px solid transparent;
}

.card-personagem:hover {
    transform: translateY(-5px) scale(1.05);
}

.card-personagem .avatar-img {
    width: clamp(50px, 10vh, 75px);
    height: clamp(50px, 10vh, 75px);
    object-fit: contain;
    margin-bottom: 8px;
}

.card-personagem .nome-heroi {
    font-size: clamp(14px, 3vh, 20px);
    font-weight: 900;
}

/* =====================================================
   CABEÇALHO DO JOGO
===================================================== */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 15px;
    background: #f1f3f5;
    border-bottom: 2px solid #dee2e6;
    flex-shrink: 0;
}

/* =====================================================
   BOTÃO VOLTAR (BLOQUEIO PARENTAL)
===================================================== */

.voltar-container {
    width: 150px;
    background: #e9ecef;
    padding: 4px 8px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.08);
}

.voltar-container label {
    font-size: 10px;
    color: #495057;
    font-weight: bold;
    text-align: center;
    display: flex;
    align-items: center;
    gap: 3px;
}

.slider-voltar {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 16px;
    border-radius: 8px;
    background: #dee2e6;
    outline: none;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.15);
    cursor: pointer;
}

.slider-voltar::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #1c7ed6;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,.25);
}

.slider-voltar::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #1c7ed6;
    cursor: pointer;
    border: none;
    box-shadow: 0 2px 5px rgba(0,0,0,.25);
}

.info-placar {
    font-size: clamp(14px, 3vh, 20px);
    font-weight: bold;
    color: #2b8a3e;
}

/* =====================================================
   ÁREA DO CANVAS (JOGO)
===================================================== */

.area-jogo {
    flex: 1;
    position: relative;
    background: linear-gradient(to bottom, #74c0fc, #a5d8ff);
    overflow: hidden;
    cursor: pointer;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* =====================================================
   INSTRUÇÕES NA TELA
===================================================== */

.dica-jogo {
    position: absolute;
    bottom: 10px;
    width: 100%;
    text-align: center;
    font-size: clamp(10px, 2.2vh, 14px);
    color: #364fc7;
    font-weight: bold;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
}

</style>

</head>

<body>

<div class="app">

    <!-- TELA DE SELEÇÃO DE HERÓIS -->
    <div id="telaSelecao">
        <h2>Escolha o seu Herói! 🦸‍♂️</h2>
        <div class="personagens-grid">
            <div class="card-personagem" onclick="iniciarJogo('aracnideo')">
                <img src="heroi1.png" alt="Herói 1" class="avatar-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'60\' height=\'60\'><text y=\'50\' font-size=\'50\'>🕷️</text></svg>'">
                <div class="nome-heroi">Herói Aranha</div>
            </div>
            <div class="card-personagem" onclick="iniciarJogo('tecnologico')">
                <img src="heroi2.png" alt="Herói 2" class="avatar-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'60\' height=\'60\'><text y=\'50\' font-size=\'50\'>🤖</text></svg>'">
                <div class="nome-heroi">Herói Blindado</div>
            </div>
        </div>
        <p style="font-size: 13px; opacity: 0.9;">Toque em um herói para começar a aventura!</p>
    </div>

    <!-- CABEÇALHO -->
    <header>
        <div class="voltar-container">
            <label for="sliderVoltar">🔒 Arraste ➡️ Sair</label>
            <input type="range" id="sliderVoltar" class="slider-voltar" min="0" max="100" value="0">
        </div>
        <div class="info-placar" id="txtPlacar">🪙 Moedas: 0</div>
    </header>

    <!-- CANVAS DO JOGO -->
    <div class="area-jogo" id="areaJogo">
        <canvas id="gameCanvas"></canvas>
        <div class="dica-jogo">👆 Toque na tela para o herói pular e pegar as moedas!</div>
    </div>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let heroiTipo = 'aracnideo';
let moedasColetadas = 0;
let jogoAtivo = false;

// Carregamento das Imagens
const imgHeroi1 = new Image();
imgHeroi1.src = 'heroi1.png';

const imgHeroi2 = new Image();
imgHeroi2.src = 'heroi2.png';

let heroi1Carregada = false;
let heroi2Carregada = false;

imgHeroi1.onload = () => { heroi1Carregada = true; };
imgHeroi2.onload = () => { heroi2Carregada = true; };

// Configurações do Herói (Física de Pulo)
let heroi = {
    x: 60,
    y: 150,
    largura: 50,
    altura: 50,
    gravidade: 0.45,
    velocidadeY: 0,
    forcaPulo: -8.5
};

let moedas = [];
let contadorFrames = 0;

function ajustarTamanhoCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}

window.addEventListener('resize', ajustarTamanhoCanvas);

function iniciarJogo(tipo) {
    heroiTipo = tipo;
    moedasColetadas = 0;
    document.getElementById("txtPlacar").textContent = "🪙 Moedas: " + moedasColetadas;
    document.getElementById("telaSelecao").style.display = "none";
    
    ajustarTamanhoCanvas();
    heroi.y = canvas.height / 2;
    heroi.velocidadeY = 0;
    moedas = [];
    contadorFrames = 0;
    jogoAtivo = true;

    loop();
}

// Ação de Pular ao Tocar/Clicar
function acaoPular() {
    if (!jogoAtivo) return;
    heroi.velocidadeY = heroi.forcaPulo;
}

const areaJogo = document.getElementById("areaJogo");
areaJogo.addEventListener("click", acaoPular);
areaJogo.addEventListener("touchstart", (e) => {
    e.preventDefault();
    acaoPular();
}, { passive: false });

// Bloqueio Parental (Deslizar para Voltar)
const sliderVoltar = document.getElementById("sliderVoltar");

function resetarSlider() {
    if (sliderVoltar.value < 100) {
        sliderVoltar.value = 0;
    }
}

sliderVoltar.addEventListener("input", function() {
    if (parseInt(this.value, 10) === 100) {
        window.location.href = "index.html";
    }
});

sliderVoltar.addEventListener("change", resetarSlider);
sliderVoltar.addEventListener("touchend", resetarSlider);
sliderVoltar.addEventListener("mouseup", resetarSlider);

// Loop principal do jogo
function loop() {
    if (!jogoAtivo) return;

    // Atualizar física do Herói
    heroi.velocidadeY += heroi.gravidade;
    heroi.y += heroi.velocidadeY;

    // Limites da tela
    if (heroi.y < 0) {
        heroi.y = 0;
        heroi.velocidadeY = 0;
    }
    if (heroi.y > canvas.height - heroi.altura) {
        heroi.y = canvas.height - heroi.altura;
        heroi.velocidadeY = 0;
    }

    // Gerar Moedas
    contadorFrames++;
    if (contadorFrames % 85 === 0) {
        moedas.push({
            x: canvas.width + 30,
            y: Math.random() * (canvas.height - 120) + 60,
            raio: 16
        });
    }

    // Movimentar e checar colisão com Moedas
    for (let i = moedas.length - 1; i >= 0; i--) {
        moedas[i].x -= 3.5;

        let distX = heroi.x + heroi.largura / 2 - moedas[i].x;
        let distY = heroi.y + heroi.altura / 2 - moedas[i].y;
        let distancia = Math.sqrt(distX * distX + distY * distY);

        if (distancia < heroi.largura / 2 + moedas[i].raio) {
            moedasColetadas++;
            document.getElementById("txtPlacar").textContent = "🪙 Moedas: " + moedasColetadas;
            moedas.splice(i, 1);
        } else if (moedas[i].x < -30) {
            moedas.splice(i, 1);
        }
    }

    // Renderização
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Desenhar Fundo decorativo (nuvens simples)
    ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
    ctx.beginPath();
    ctx.arc(canvas.width * 0.3, 60, 30, 0, Math.PI * 2);
    ctx.arc(canvas.width * 0.7, 100, 40, 0, Math.PI * 2);
    ctx.fill();

    // Desenhar Moedas
    for (let m of moedas) {
        ctx.fillStyle = "#ffd43b";
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.raio, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#f59f00";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "#f59f00";
        ctx.font = "bold 14px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("$", m.x, m.y);
    }

    // Desenhar Herói (com imagem ou fallback para emoji)
    let imagemAtual = heroiTipo === 'aracnideo' ? imgHeroi1 : imgHeroi2;
    let imgPronta = heroiTipo === 'aracnideo' ? heroi1Carregada : heroi2Carregada;

    if (imgPronta && imagemAtual.complete && imagemAtual.naturalWidth !== 0) {
        ctx.drawImage(imagemAtual, heroi.x, heroi.y, heroi.largura, heroi.altura);
    } else {
        ctx.font = "40px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        let emojiFallback = heroiTipo === 'aracnideo' ? '🕷️' : '🤖';
        ctx.fillText(emojiFallback, heroi.x + heroi.largura / 2, heroi.y + heroi.altura / 2);
    }

    requestAnimationFrame(loop);
}

</script>

</body>

</html>
